<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Disciplio: The 60 Day Life Reset</title>
    <meta name="description" content="One short lesson and one action every day, on top of the commitments you choose. Do them and your life stats climb. Miss a day and your streak is on the line." />

    <!-- Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Disciplio" />
    <meta property="og:title" content="Disciplio: The 60 Day Life Reset" />
    <meta property="og:description" content="Done drifting? Reset your life in 60 days. One lesson and one action, every day." />
    <meta property="og:url" content="https://www.disciplio.app/" />
    <meta property="og:image" content="https://www.disciplio.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Disciplio: The 60 Day Life Reset" />
    <meta name="twitter:description" content="Done drifting? Reset your life in 60 days. One lesson and one action, every day." />
    <meta name="twitter:image" content="https://www.disciplio.app/og-image.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a120e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Disciplio" />
    <link rel="apple-touch-icon" href="/icons/disciplio-icon.svg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icons/disciplio-icon.svg" />

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // The marketing site does not use a service worker. Register the
      // self-destroying sw.js once so devices that still hold the old PWA
      // worker clear it, then stop registering anything at all.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.getRegistrations().then((regs) => {
            if (regs.length) navigator.serviceWorker.register('/sw.js');
          });
        });
      }
    </script>
  </body>
</html>
